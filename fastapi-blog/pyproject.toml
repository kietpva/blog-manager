[project]
name = "fastapi-blog"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "alembic>=1.18.4",
    "fastapi[standard]>=0.135.1",
    "python-jose[cryptography]>=3.3.0",
    "psycopg[binary]>=3.3.3",
    "requests>=2.32.5",
    "sqlalchemy>=2.0.48",
    "pyngrok>=7.5.1",
    "svix>=1.88.0",
    "python-dotenv>=1.2.2",
]

[dependency-groups]
dev = [
    "pre-commit>=4.5.1",
    "pytest>=9.0.2",
    "pytest-cov>=7.1.0",
]

[tool.pytest.ini_options]
pythonpath = ["."]
